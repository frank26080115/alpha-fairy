; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
include_dir = includes
lib_dir = libs

[env]
platform = platformio/espressif32@6.10.0
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 500000
lib_deps =
    m5stack/M5Unified
lib_ignore =
    M5StickCPlus

[env:m5stick-c-plus]
board = m5stick-c
board_build.partitions = partitions/4mb.csv
build_flags =
    -DM5GFX_BOARD=board_M5StickCPlus

[env:m5stick-c-plus2]
board = m5stick-c
board_build.partitions = partitions/4mb.csv
build_flags =
    -DM5GFX_BOARD=board_M5StickCPlus2

[env:m5stick-s3]
board = esp32-s3-devkitc-1
board_build.partitions = partitions/8mb.csv
build_flags =
    -DM5GFX_BOARD=board_M5StickS3

# no jtag pin on m5stick-c for debugging
# debug_tool = esp-prog
